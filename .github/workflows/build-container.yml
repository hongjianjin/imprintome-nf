name: Build imprintomeR container

on:
  workflow_dispatch:
    inputs:
      imprintomer_ref:
        description: "imprintomeR git tag to install"
        default: "v1.5.3"
  push:
    branches: [main]
    paths:
      - "containers/imprintomer/**"
      - ".github/workflows/build-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ github.event.inputs.imprintomer_ref || 'v1.5.3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=${REF#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: containers/imprintomer
          build-args: IMPRINTOMER_REF=${{ env.REF }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/imprintomer:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/imprintomer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
